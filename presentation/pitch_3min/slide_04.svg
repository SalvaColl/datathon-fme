<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Cada señal suma. Cada comprador cuenta."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101A29"/><rect x="70" y="70" width="36" height="6" rx="0" fill="#61E4B1"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="20" font-weight="700"><tspan x="122" y="75.8">NUESTRO MODELO</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="74" font-weight="700"><tspan x="70" y="209.56">Cada señal suma.</tspan><tspan x="70" y="297.62">Cada comprador cuenta.</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="75" y="356.32">Un modelo lineal: combina señales y ordena los productos para cada persona.</tspan></text><rect x="70" y="415" width="425" height="325" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="21" font-weight="700"><tspan x="100" y="462.74">01 · SEÑALES</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="100" y="527.26">Gustos del comprador</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="100" y="582.26">Actividad de la sesión</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="100" y="637.26">Calidad del producto</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="100" y="692.26">Tendencias de la tienda</tspan></text><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="58" font-weight="700"><tspan x="515" y="609.52">→</tspan></text><rect x="595" y="415" width="430" height="325" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="21" font-weight="700"><tspan x="625" y="462.74">02 · PUNTUACIÓN</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-siz