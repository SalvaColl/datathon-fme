<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="One policy. Different evidence."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101A29"/><rect x="70" y="70" width="36" height="6" rx="0" fill="#61E4B1"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="20" font-weight="700"><tspan x="122" y="75.8">METHOD / PERSONALIZATION</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="17" font-weight="400"><tspan x="70" y="857.98">TEAM 26  /  RAWTREE × DATATHON FME 2026</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="18" font-weight="400"><tspan x="1450" y="856.92">02 / 06</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="78" font-weight="700"><tspan x="70" y="216.32">One policy.</tspan><tspan x="70" y="309.14">Different evidence.</tspan></text><rect x="70" y="390" width="680" height="250" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="98" y="430.92">RETURNING SHOPPER</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="98" y="488.96">History + current intent</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="98" y="546.5">Preferences, activity and tastes</tspan><tspan x="98" y="576.25">from earlier requests.</tspan></text><rect x="780" y="390" width="750" height="250" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="808" y="430.92">NEW SHOPPER</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="808" y="488.96">Session + previous visits</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="808" y="546.5">Start with what we know now.</tspan><tspan x="808" y="576.25">Remember the next time they return.</tspan></text><rect x="70" y="690" width="1460" height="87" rx="16" fill="#304154"/><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="29" font-weight="400"><tspan x="98" y="741.26">Affinity  +  organic quality  +  live context   →   ranked, eligible products</tspan></text></svg>