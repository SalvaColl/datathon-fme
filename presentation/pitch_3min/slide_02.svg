<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Observar. Cambiar. Comprobar."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101A29"/><rect x="70" y="70" width="36" height="6" rx="0" fill="#61E4B1"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="20" font-weight="700"><tspan x="122" y="75.8">OBSERVACIONES QUE CAMBIARON EL MODELO</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="78" font-weight="700"><tspan x="70" y="216.32">Observar. Cambiar.</tspan><tspan x="70" y="309.14">Comprobar.</tspan></text><rect x="70" y="365" width="470" height="340" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="98" y="405.92">01 · OBSERVAR</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="98" y="463.96">Los gustos se repiten</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="98" y="521.5">Las compras se relacionaban con</tspan><tspan x="98" y="551.25">los atributos de productos vistos</tspan><tspan x="98" y="581.0">antes.</tspan></text><rect x="565" y="365" width="470" height="340" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="593" y="405.92">02 · CAMBIAR</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="593" y="463.96">Añadimos afinidad</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="593" y="521.5">Dimos más puntuación a los</tspan><tspan x="593" y="551.25">productos cuyos atributos encajaban</tspan><tspan x="593" y="581.0">con esos gustos.</tspan></text><rect x="1060" y="365" width="470" height="340" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="1088" y="405.92">03 · COMPROBAR</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="1088" y="463.96">47,2% → 51,9%</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="1088" y="521.5">Veces que el producto comprado</tspan><tspan x="1088" y="551.25">quedó primero, en 4.697 sesiones</tspan><tspan x="1088" y="581.0">del historial.</tspan></text><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="30" font-weight="700"><tspan x="75" y="773.2">Mismo modelo + afinidad → más aciertos en la prueba histórica</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="75" y="817.5">Medimos el orden de los productos, no la conversión en vivo.</tspan></text></svg>