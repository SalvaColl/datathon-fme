<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Un modelo sencillo. Una elección medida."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101A29"/><rect x="70" y="70" width="36" height="6" rx="0" fill="#61E4B1"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="20" font-weight="700"><tspan x="122" y="75.8">POR QUÉ ESTE MODELO / CÓMO LO ENTRENAMOS</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="17" font-weight="400"><tspan x="70" y="857.98">EQUIPO 26  /  RAWTREE × DATATHON FME 2026</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="18" font-weight="400"><tspan x="1450" y="856.92">02 / 06</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="78" font-weight="700"><tspan x="70" y="216.32">Un modelo sencillo.</tspan><tspan x="70" y="309.14">Una elección medida.</tspan></text><rect x="70" y="390" width="460" height="245" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="98" y="430.92">01 / EJEMPLOS</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="98" y="488.96">Solo lo mostrado</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="98" y="546.5">Clics como señal.</tspan><tspan x="98" y="576.25">Compras con peso ×3.</tspan></text><rect x="550" y="390" width="460" height="245" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="578" y="430.92">02 / AJUSTE</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="578" y="488.96">Incluir la posición</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="578" y="546.5">Regresión logística.</tspan><tspan x="578" y="576.25">Pesos por tipo de usuario.</tspan></text><rect x="1030" y="390" width="500" height="245" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="1058" y="430.92">03 / VALIDACIÓN</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="1058" y="488.96">Validación temporal</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="1058" y="546.5">Entrenar antes.</tspan><tspan x="1058" y="576.25">Evaluar después.</tspan></text><rect x="70" y="690" width="1460" height="87" rx="16" fill="#304154"/><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="98" y="740.32">El modelo complejo no mejoró la prueba: elegimos rapidez y claridad.</tspan></text></svg>