<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="A small model. A deliberate choice."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101A29"/><rect x="70" y="70" width="36" height="6" rx="0" fill="#61E4B1"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="20" font-weight="700"><tspan x="122" y="75.8">WHY THIS MODEL / HOW WE TRAINED IT</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="17" font-weight="400"><tspan x="70" y="857.98">TEAM 26  /  RAWTREE × DATATHON FME 2026</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="18" font-weight="400"><tspan x="1450" y="856.92">02 / 06</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="78" font-weight="700"><tspan x="70" y="216.32">A small model.</tspan><tspan x="70" y="309.14">A deliberate choice.</tspan></text><rect x="70" y="390" width="460" height="245" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="98" y="430.92">01 / EXAMPLES</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="98" y="488.96">Learn from exposure</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="98" y="546.5">Shown products + feedback.</tspan><tspan x="98" y="576.25">Purchases weighted ×3.</tspan></text><rect x="550" y="390" width="460" height="245" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="578" y="430.92">02 / FITTING</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="578" y="488.96">Control position</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="578" y="546.5">Regularized logistic model.</tspan><tspan x="578" y="576.25">Separate known/new weights.</tspan></text><rect x="1030" y="390" width="500" height="245" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="1058" y="430.92">03 / VALIDATION</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="1058" y="488.96">Test later requests</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="1058" y="546.5">Earlier training → later test.</tspan><tspan x="1058" y="576.25">Complexity needs evidence.</tspan></text><rect x="70" y="690" width="1460" height="87" rx="16" fill="#304154"/><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="98" y="740.32">Why linear? Fast to serve, easy to inspect, retained after held-out comparisons.</tspan></text></svg>