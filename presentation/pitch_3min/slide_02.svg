<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Observar. Cambiar. Comprobar."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101A29"/><rect x="70" y="70" width="36" height="6" rx="0" fill="#61E4B1"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="20" font-weight="700"><tspan x="122" y="75.8">OBSERVACIONES QUE CAMBIARON EL MODELO</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="78" font-weight="700"><tspan x="70" y="216.32">Observar. Cambiar.</tspan><tspan x="70" y="309.14">Comprobar.</tspan></text><rect x="70" y="365" width="470" height="340" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="98" y="405.92">01 · OBSERVAR</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="98" y="463.96">Los gustos se repiten</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="98" y="521.5">En el historial, las compras se</tspan><tspan x="98" y="551.25">relacionaban con los atributos de</tspan><tspan x="98" y="581.0">productos vistos antes.</tspan></text><rect x="565" y="365" width="470" height="340" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="593" y="405.92">02 · CAMBIAR</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="593" y="463.96">Añadimos afinidad</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="593" y="521.5">Dimos más puntuación a productos</tspan><tspan x="593" y="551.25">cuyos atributos encajaban con esos</tspan><tspan x="593" y="581.0">gustos.</tspan></text><rect x="1060" y="365" width="470" height="340" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="1088" y="405.92">03 · COMPROBAR</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="1088" y="463.96">Compras en vivo</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="1088" y="521.5">Por 10.000 exposiciones:</tspan><tspan x="1088" y="551.25">Afinidad baja: 0,6 compras</tspan><tspan x="1088" y="581.0">Afinidad alta: 89,7 compras</tspan></text><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="30" font-weight="700"><tspan x="75" y="773.2">La señal del historial también aparece en nuestro feedback real</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="24" font-weight="400"><tspan x="75" y="816.56">Comparación entre afinidad baja y alta; no es un antes y después del modelo.</tspan></text></svg>