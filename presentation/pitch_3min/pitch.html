<script>const data=[{"notes": "Diez productos. Tres segundos. Un comprador. Somos el equipo 26. Lo dif\u00edcil no era a\u00f1adir otro modelo, sino decidir qu\u00e9 se\u00f1ales creer y llegar a tiempo.", "seconds": 15}, {"notes": "Probamos modelos m\u00e1s complejos, pero no mejoraron los resultados con datos apartados. Elegimos un modelo lineal: r\u00e1pido e interpretable. En el entrenamiento base usamos solo productos mostrados. Aprendemos de los clics, dando triple peso a las compras, e incluimos la posici\u00f3n. Entrenamos con peticiones anteriores y validamos despu\u00e9s. Los ajustes finales se eligieron por segmento, con pruebas adicionales.", "seconds": 35}, {"notes": "Congelamos los pesos, no la tienda. Seguimos actualizando memoria, calidad, stock y precios. Separamos nuestras recomendaciones de la actividad org\u00e1nica para no inflar la calidad de un producto. Detectamos tendencias comparando eventos recientes con su nivel habitual. As\u00ed nos adaptamos sin reajustar el modelo con unas pocas compras ruidosas. Y mantenemos todas las exclusiones de compras anteriores.", "seconds": 35}, {"notes": "El hist\u00f3rico refleja lo que otros modelos eligieron mostrar. Por eso el offline solo filtra ideas. En vivo comparamos con la referencia de la misma ventana: una hora favorable no deb\u00eda parecer un modelo mejor. En ocho bloques, el reajuste mostr\u00f3 0,17 puntos m\u00e1s, con 10.800 peticiones por pol\u00edtica. No fue un A/B aleatorizado. Tambi\u00e9n buscamos fallos que los tests no estaban cubriendo.", "seconds": 35}, {"notes": "RawTree, creado por Tinybird, es la base de nuestro circuito. Leemos peticiones, eventos y cambios del cat\u00e1logo. Con SQL agrupamos vistas y compras para alimentar la calidad de producto y las tendencias. Escribimos recomendaciones por lotes, recuperamos su feedback y guardamos m\u00e9tricas en scratch. As\u00ed podemos explicar cada decisi\u00f3n y detectar fallos. En pr\u00e1ctica, el 99,96 % de las respuestas lleg\u00f3 a tiempo.", "seconds": 35}, {"notes": "Claude y Codex nos ayudaron a implementar experimentos, auditar c\u00f3digo y buscar fallos. El equipo control\u00f3 las pruebas y el despliegue. Cubrimos modelos, nuevas se\u00f1ales, evaluaci\u00f3n y fiabilidad. Los agentes aceleraron el trabajo; la evidencia decidi\u00f3 qu\u00e9 conservar. Nos quedamos con una idea: construir r\u00e1pido y comprobar con rigor.", "seconds": 25}];let idx=+(new URLSearchParams(location.search).get('s')||0),start=null;const pages=[...document.querySelectorAll('.slide')],note=document.getElementById('notes');
function show(i){idx=Math.max(0,Math.min(pages.length-1,i));pages.forEach((p,k)=>p.classList.toggle('active',k===idx));note.textContent=data[idx].seconds+' s — '+data[idx].notes;document.title='Equipo 26 — '+(idx+1)+'/6';}
function next(){if(start===null)start=performance.now();show(idx+1)}function toggleNotes(){note.classList.toggle('open')}function full(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}
document.getElementById('prev').onclick=()=>show(idx-1);document.getElementById('next').onclick=next;document.getElementById('nt').onclick=toggleNotes;document.getElementById('fs').onclick=full;document.getElementById('rs').onclick=()=>start=performance.now();
document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();next()}if(['ArrowLeft','PageUp'].includes(e.key))show(idx-1);if(e.key.toLowerCase()==='n')toggleNotes();if(e.key.toLowerCase()==='f')full();if(e.key.toLowerCase()==='r')start=performance.now();if(e.key==='Home')show(0);if(e.key==='End')show(pages.length-1)});
if(new URLSearchParams(location.search).has('clean'))document.querySelector('nav').style.display='none';
setInterval(()=>{const n=start===null?0:Math.floor((performance.now()-start)/1000);document.getElementById('clock').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')+' / 03:00';},250);show(idx);
</script></html>
