xt fill="#61E4B1" font-family="Arial, sans-serif" font-size="20" font-weight="700"><tspan x="122" y="75.8">WHY THIS MODEL / HOW WE TRAINED IT</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="17" font-weight="400"><tspan x="70" y="857.98">TEAM 26  /  RAWTREE × DATATHON FME 2026</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="18" font-weight="400"><tspan x="1450" y="856.92">02 / 06</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="78" font-weight="700"><tspan x="70" y="216.32">A small model.</tspan><tspan x="70" y="309.14">A deliberate choice.</tspan></text><rect x="70" y="390" width="460" height="245" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="98" y="430.92">01 / EXAMPLES</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="98" y="488.96">Learn from exposure</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="98" y="546.5">Shown products + feedback.</tspan><tspan x="98" y="576.25">Purchases weighted ×3.</tspan></text><rect x="550" y="390" width="460" height="245" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="578" y="430.92">02 / FITTING</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="578" y="488.96">Control position</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="578" y="546.5">Regularized logistic model.</tspan><tspan x="578" y="576.25">Separate known/new weights.</tspan></text><rect x="1030" y="390" width="500" height="245" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="1058" y="430.92">03 / VALIDATION</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="1058" y="488.96">Test later requests</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="1058" y="546.5">Earlier training → later test.</tspan><tspan x="1058" y="576.25">Complexity needs evidence.</tspan></text><rect x="70" y="690" width="1460" height="87" rx="16" fill="#304154"/><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="98" y="740.32">Why linear? Fast to serve, easy to inspect, retained after held-out comparisons.</tspan></text></svg></section><section class="slide" aria-label="Slide 3"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Frozen weights. Live intelligence."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101A29"/><rect x="70" y="70" width="36" height="6" rx="0" fill="#61E4B1"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="20" font-weight="700"><tspan x="122" y="75.8">WHY THIS ADAPTATION / HOW IT STAYS STABLE</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="17" font-weight="400"><tspan x="70" y="857.98">TEAM 26  /  RAWTREE × DATATHON FME 2026</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="18" font-weight="400"><tspan x="1450" y="856.92">03 / 06</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="79" font-weight="700"><tspan x="70" y="219.26">Frozen weights.</tspan><tspan x="70" y="313.27">Live intelligence.</tspan></text><rect x="70" y="395" width="460" height="240" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="98" y="435.92">01 / SHOPPER MEMORY</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="98" y="493.96">Use earlier visits</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="98" y="551.5">Session evidence accumulates.</tspan><tspan x="98" y="581.25">Known purchases stay out.</tspan></text><rect x="550" y="395" width="460" height="240" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="578" y="435.92">02 / PRODUCT QUALITY</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="578" y="493.96">Keep sources separate</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="578" y="551.5">Organic counts → quality.</tspan><tspan x="578" y="581.25">Private buys → user memory.</tspan></text><rect x="1030" y="395" width="500" height="240" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="1058" y="435.92">03 / TRENDS</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="1058" y="493.96">Compare event windows</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="1058" y="551.5">Recent activity vs baseline.</tspan><tspan x="1058" y="581.25">No timetable assumptions.</tspan></text><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="31" font-weight="700"><tspan x="75" y="733.14">Why: adapt from live evidence; keep the final policy stable.</tspan></text></svg></section><section class="slide" aria-label="Slide 4"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Measure before believing."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101A29"/><rect x="70" y="70" width="36" height="6" rx="0" fill="#61E4B1"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="20" font-weight="700"><tspan x="122" y="75.8">METHOD / EVIDENCE</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="17" font-weight="400"><tspan x="70" y="857.98">TEAM 26  /  RAWTREE × DATATHON FME 2026</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="18" font-weight="400"><tspan x="1450" y="856.92">04 / 06</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="79" font-weight="700"><tspan x="70" y="219.26">Measure before</tspan><tspan x="70" y="313.27">believing.</tspan></text><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="140" font-weight="700"><tspan x="870" y="286.6">+0.17</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="400"><tspan x="880" y="358.96">percentage points</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="24" font-weight="400"><tspan x="880" y="404.56">Observed after refitting the weights</tspan></text><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="25" font-weight="700"><tspan x="78" y="453.5">01</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="140" y="452.26">Temporal offline</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="22" font-weight="400"><tspan x="140" y="483.68">Screen hypotheses without future information.</tspan></text><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="25" font-weight="700"><tspan x="78" y="544.5">02</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="140" y="543.26">Matched windows</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="22" font-weight="400"><tspan x="140" y="574.68">Compare against the reference at the same time.</tspan></text><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="25" font-weight="700"><tspan x="78" y="635.5">03</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="140" y="6 ial, sans-serif" font-size="19" font-weight="400"><tspan x="75" y="779.86">PRACTICE / 15 NOV 03:20–05:20 CET · TIME BLOCKS, NOT RANDOMIZED A/B</tspan></text></svg></section><section class="slide" aria-label="Slide 5"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Precompute. Validate. Batch."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101A29"/><rect x="70" y="70" width="36" height="6" rx="0" fill="#61E4B1"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="20" font-weight="700"><tspan x="122" y="75.8">WHY IT IS FAST / HOW RAWTREE SUPPORTS IT</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="17" font-weight="400"><tspan x="70" y="857.98">TEAM 26  /  RAWTREE × DATATHON FME 2026</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="18" font-weight="400"><tspan x="1450" y="856.92">05 / 06</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="79" font-weight="700"><tspan x="70" y="219.26">Precompute.</tspan><tspan x="70" y="313.27">Validate. Batch.</tspan></text><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="126" font-weight="700"><tspan x="75" y="515.44">99.96%</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="29" font-weight="400"><tspan x="82" y="577.26">valid and on time · 43,200 requests</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="83" y="628.32">p99  2.35 s     /     deadline  3 s</tspan></text><rect x="890" y="164" width="640" height="533" rx="24" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="23" font-weight="700"><tspan x="925" y="217.62">RAWTREE → ONE SERVING LOOP</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="30" font-weight="400"><tspan x="931" y="306.2">Requests + events + catalogue</tspan></text><rect x="934" y="328" width="3" height="22" rx="0" <script>const data=[{"notes": "Ten products. Three seconds. One shopper. We are Team 26. The difficult part was choosing what to trust: old data, live behavior, or a more complicated model. Our answer was to make every extra layer earn its place.", "seconds": 15}, {"notes": "We kept a linear ranker because gradient boosting did not improve our held-out results. For baseline training, each shown product becomes an example; unshown products are not labeled failures. Clicks provide more examples, while purchases receive three times the weight. We model slot position because exposure changes behavior. We reconstruct earlier shopper state and test on later requests. The final policy then combines cohort-specific refits and overrides, rather than blindly deploying the default training output.", "seconds": 40}, {"notes": "We separated changing evidence from stable model weights. Shopper memory updates as people return, including new shoppers without historical profiles. Product quality uses organic views and purchases; recommendation purchases update user memory, not the organic rate. That separation prevents a feedback loop. Trends come from recent events versus a baseline, not yesterday's clock. This lets us adapt during the final without refitting on a handful of noisy purchases. Previous purchases still stay excluded.", "seconds": 35}, {"notes": "Offline screening was not enough, because logged impressions reflect what earlier policies chose to show. For live checks, we compared against the reference in the same windows, so a better hour would not look like a better model. Across eight practice blocks, refitted weights showed a zero-point-seventeen percentage-point improvement, with ten thousand eight hundred requests per policy. These were time blocks, not randomized A/B. We also rejected ideas and wrote counterexamples when passing tests missed real query behavior.", "seconds": 40}, {"notes": "To protect the deadline, SQL aggregation runs in the background and local scoring stays small. We validate products before batched writes, with one writer and durable request claims. That design served ninety-nine-point-nine-six percent on time across forty-three thousand two hundred practice requests. RawTree snapshots and feedback let us trace a decision from input to outcome.", "seconds": 25}, {"notes": "We used Claude and Codex to implement experiments, audit code and find failure cases in isolated branches. People controlled integration, measurements and the single live deployment. The four of us covered modeling, independent challengers, cold-start research and reliability. The lesson was to use agents to move faster, while making every claimed improvement explainable and testable. Build fast. Verify carefully.", "seconds": 25}];let idx=+(new URLSearchParams(location.search).get('s')||0),start=null;const pages=[...document.querySelectorAll('.slide')],note=document.getElementById('notes');

function next(){if(start===null)start=performance.now();show(idx+1)}function toggleNotes(){note.classList.toggle('open')}function full(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}
