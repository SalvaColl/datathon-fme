<script>const data=[{"notes": "Every shopper gives us one decision: which ten products should we show, right now? We have three seconds, and the store keeps changing. We are Team 26. We built a recommender that remembers the shopper, adapts to the stream, and arrives before the deadline.", "seconds": 20}, {"notes": "Our final system uses one lightweight linear ranker, with different weights for the shopper and page context. For returning shoppers, it combines historical preferences with current activity and tastes inferred from previous requests. For new shoppers, it starts with the current session and remembers earlier visits. Product quality comes from organic purchases and views. We train ranking weights using our own recommendation feedback, and always exclude known purchases.", "seconds": 35}, {"notes": "Freezing the model does not freeze the store. We keep updating shopper activity, organic product quality, stock and prices. Our trend detector looks for changes in the event stream, rather than assuming yesterday's timetable will repeat. New launches can enter the ranking, with controlled exposure on home pages. At the final-round boundary, the world continues: Saturday's products and previous purchases still count. Cart events are activity signals, not pending orders.", "seconds": 40}, {"notes": "Our most useful improvement was also methodological. Historical impressions are biased, so offline evaluation uses temporal splits and only screens ideas. Live comparisons use the same time window as the organizers' reference, because traffic and trends change. Across eight practice blocks, refitted weights showed a zero-point-seventeen percentage-point improvement over the previous policy, with ten thousand eight hundred requests per policy. This was a time-block comparison, not a randomized trial. The newest preference feature has offline support, but no demonstrated live uplift yet.", "seconds": 40}, {"notes": "RawTree is our operating backbone. SQL connects requests, store events, catalogue updates and private feedback. Background snapshots feed the ranker; validation checks the ten products before batched submission. In a documented four-hour practice window, we served ninety-nine-point-nine-six percent of forty-three thousand two hundred requests on time. The ninety-ninth latency percentile was two-point-three-five seconds, below the three-second limit. One writer prevents duplicate submissions, and stored snapshots make our decisions auditable.", "seconds": 30}, {"notes": "In our last measured practice hour, expected conversion reached two-point-one-five-nine percent across ten thousand eight hundred requests. The final result is still unknown. Our promise is simple: the right products, for this shopper, before the deadline.", "seconds": 15}];let idx=+(new URLSearchParams(location.search).get('s')||0),start=null;const pages=[...document.querySelectorAll('.slide')],note=document.getElementById('notes');
function show(i){idx=Math.max(0,Math.min(pages.length-1,i));pages.forEach((p,k)=>p.classList.toggle('active',k===idx));note.textContent=data[idx].seconds+' sec — '+data[idx].notes;document.title='Team 26 — '+(idx+1)+'/6';}
function next(){if(start===null)start=performance.now();show(idx+1)}function toggleNotes(){note.classList.toggle('open')}function full(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}
document.getElementById('prev').onclick=()=>show(idx-1);document.getElementById('next').onclick=next;document.getElementById('nt').onclick=toggleNotes;document.getElementById('fs').onclick=full;document.getElementById('rs').onclick=()=>start=performance.now();
document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();next()}if(['ArrowLeft','PageUp'].includes(e.key))show(idx-1);if(e.key.toLowerCase()==='n')toggleNotes();if(e.key.toLowerCase()==='f')full();if(e.key.toLowerCase()==='r')start=performance.now();if(e.key==='Home')show(0);if(e.key==='End')show(pages.length-1)});
if(new URLSearchParams(location.search).has('clean'))document.querySelector('nav').style.display='none';
setInterval(()=>{const n=start===null?0:Math.floor((performance.now()-start)/1000);document.getElementById('clock').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')+' / 03:00';},250);show(idx);
</script></html>
