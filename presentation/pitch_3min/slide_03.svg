<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Menos complejidad. Más evidencia."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101A29"/><rect x="70" y="70" width="36" height="6" rx="0" fill="#61E4B1"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="20" font-weight="700"><tspan x="122" y="75.8">QUÉ DESCARTAMOS / CON QUÉ NOS QUEDAMOS</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="78" font-weight="700"><tspan x="70" y="216.32">Menos complejidad.</tspan><tspan x="70" y="309.14">Más evidencia.</tspan></text><rect x="70" y="365" width="650" height="415" rx="22" fill="#192638"/><text fill="#FFAC86" font-family="Arial, sans-serif" font-size="21" font-weight="700"><tspan x="100" y="414.74">DESCARTAMOS</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="100" y="477.26">Más complejidad e interacciones</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="100" y="515.5">No mejoraron la validación.</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="100" y="582.26">La variante con grafo</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="100" y="620.5">Su ventaja no se repitió.</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="100" y="687.26">El orden de las visitas</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="100" y="725.5">Sin mejora adicional confirmada.</tspan></text><rect x="745" y="365" width="785" height="415" rx="22" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="21" font-weight="700"><tspan x="780" y="414.74">NUESTRO ENFOQUE FINAL</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="780" y="480.96">Un modelo lineal, rápido y explicable</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="780" y="540.38">Aprende de clics y compras</tspan><tspan x="780" y="572.51">Las compras pesan ×3 en el entrenamiento.</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="780" y="635.38">Combina gustos, sesión, calidad y tendencias</tspan></text><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="28" font-weight="700"><tspan x="780" y="731.32">Pesos fijos. Datos de la tienda actualizados.</tspan></text></svg>