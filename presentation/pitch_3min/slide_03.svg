<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Una ronda no bastaba."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101A29"/><rect x="70" y="70" width="36" height="6" rx="0" fill="#61E4B1"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="20" font-weight="700"><tspan x="122" y="75.8">IDEAS DESCARTADAS / POR QUÉ REPETIMOS LAS PRUEBAS</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="79" font-weight="700"><tspan x="70" y="217.26">Una ronda</tspan><tspan x="70" y="311.27">no bastaba.</tspan></text><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="25" font-weight="700"><tspan x="810" y="188.5">¿Ayuda relacionar productos entre sí?</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="22" font-weight="400"><tspan x="810" y="224.68">Conversión · usuarios conocidos en páginas</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="22" font-weight="400"><tspan x="830" y="255.68">Ronda</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="22" font-weight="400"><tspan x="1000" y="255.68">Base</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="22" font-weight="400"><tspan x="1175" y="255.68">+ relaciones</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="22" font-weight="400"><tspan x="1380" y="255.68">Diferencia</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="830" y="319.26">01</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="1000" y="319.26">1,57%</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="1175" y="319.26">1,77%</tspan></text><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="25" font-weight="700"><tspan x="1380" y="315.5">+0,20 pp</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="830" y="385.26">02</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="1000" y="385.26">2,08%</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="1175" y="385.26">1,67%</tspan></text><text fill="#FFAC86" font-family="Arial, sans-serif" font-size="25" font-weight="700"><tspan x="1380" y="381.5">−0,41 pp</tspan></text><text fill="#FFAC86" font-family="Arial, sans-serif" font-size="24" font-weight="700"><tspan x="830" y="451.56">No repitió la mejora → descartamos esa variante</tspan></text><rect x="70" y="528" width="1460" height="112" rx="16" fill="#192638"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="24" font-weight="700"><tspan x="100" y="573.56">También descartamos</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="100" y="615.38">Ni modelos más complejos ni el orden de las visitas mejoraron la validación</tspan></text><rect x="70" y="681" width="1460" height="74" rx="13" fill="#304154"/><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="98" y="725.44">Elegimos un modelo lineal: aprende de clics y compras; se valida con datos posteriores</tspan></text></svg>