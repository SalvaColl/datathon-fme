<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="El cementerio de ideas."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101A29"/><rect x="70" y="70" width="36" height="6" rx="0" fill="#61E4B1"/><text fill="#61E4B1" font-family="Arial, sans-serif" font-size="20" font-weight="700"><tspan x="122" y="75.8">IDEAS DESCARTADAS</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="83" font-weight="700"><tspan x="70" y="218.01999999999998">El cementerio de ideas.</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="31" font-weight="400"><tspan x="75" y="287.14">Una idea prometedora tenía que sobrevivir a los datos.</tspan></text><rect x="70" y="365" width="1460" height="2" rx="0" fill="#304154"/><text fill="#FFAC86" font-family="Arial, sans-serif" font-size="55" font-weight="400"><tspan x="85" y="448.7">01</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="33" font-weight="700"><tspan x="205" y="432.02">Modelos demasiado complejos</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="850" y="420.32">Gradient boosting e interacciones entre señales:</tspan><tspan x="850" y="453.64">no mejoraron las pruebas.</tspan></text><rect x="70" y="515" width="1460" height="2" rx="0" fill="#304154"/><text fill="#FFAC86" font-family="Arial, sans-serif" font-size="55" font-weight="400"><tspan x="85" y="598.7">02</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="33" font-weight="700"><tspan x="205" y="582.02">Productos vistos en la misma sesión</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="850" y="570.32">Parecía lógico recomendarlos juntos.</tspan><tspan x="850" y="603.6400000000001">Las pruebas no confirmaron una mejora.</tspan></text><rect x="70" y="665" width="1460" height="2" rx="0" fill="#304154"/><text fill="#FFAC86" font-family="Arial, sans-serif" font-size="55" font-weight="400"><tspan x="85" y="748.7">03</tspan></text><text fill="#F5F7FA" font-family="Arial, sans-serif" font-size="33" font-weight="700"><tspan x="205" y="732.02">Usar el orden de las visitas</tspan></text><text fill="#A6B5C8" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="850" y="720.32">Saber qué miró primero y qué después</tspan><tspan x="850" y="753.6400000000001">no mejoró las recomendaciones.</tspan></text></svg>